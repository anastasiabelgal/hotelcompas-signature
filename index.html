<title>Compas Signature Generators</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef1f5}
  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dfe3e8;padding:14px 18px}
  .wrap{max-width:1280px;margin:0 auto}
  .brandline{display:flex;align-items:center;justify-content:space-between;gap:18px}
  .title{font-size:18px;font-weight:800;color:#111}
  .switch{position:relative;display:grid;grid-template-columns:1fr 1fr;width:360px;height:44px;background:#eef1f4;border-radius:12px;padding:4px;box-shadow:inset 0 0 0 1px #d7dce1}
  .slider{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .22s ease}
  .switch.jet .slider{transform:translateX(100%)}
  .tab{position:relative;z-index:2;border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:800;color:#555}
  .tab.active{color:#111}
  .pages{max-width:1320px;margin:0 auto;padding:16px}
  .page{display:none}
  .page.active{display:block}
  iframe{display:block;width:100%;height:1200px;border:0;border-radius:12px;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.05)}
  @media(max-width:720px){
    .brandline{align-items:flex-start;flex-direction:column}
    .switch{width:100%}
    .pages{padding:8px}
    iframe{height:1500px}
  }
</style>
</head>

    </div>
  </div>
</div>

  .photo-actions {

  }
  .small {

  }

    padding:11px 14px;
    font-weight:800;
    cursor:pointer;
    font-size:13px;
  }
  .btn-primary {
    background:#0063FF;
    color:white;
    width:100%;
    margin-top:18px;
  }
  .btn-secondary {
    background:#eef4ff;
    color:#0063FF;
  }
  .btn-row {
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .status {
    margin-top:10px;
    min-height:18px;
    font-size:12px;
    font-weight:700;
  }
  .status.ok { color:#0a7a35; }
  .status.err { color:#b42318; }
  .preview-label {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
  }
  .signature-stage {
    background:#fff;
    padding:4px;
    width:max-content;
    min-width:760px;
  }
  .note {
    margin-top:14px;

    color:#475569;

  }
  @media(max-width: 980px) {
    .layout { grid-template-columns:1fr; }
    .form-panel { position:static; }
  }

        After clicking &lt;b&gt;COPY SIGNATURE&lt;/b&gt;: Gmail → Settings → See all settings → General → Signature → Create new → paste with Ctrl+V / Cmd+V. Do not edit the photo in Gmail. Keep the employee photo hosted at a public HTTPS URL so image quality stays high and the Gmail signature remains small.

&lt;script&gt;
(function() {
  const $ = id =&gt; document.getElementById(id);
  const nameInput = $(&#x27;nameInput&#x27;);
  const titleInput = $(&#x27;titleInput&#x27;);
  const emailInput = $(&#x27;emailInput&#x27;);
  const phoneInput = $(&#x27;phoneInput&#x27;);
  const linkedinInput = $(&#x27;linkedinInput&#x27;);
  const linkedinTextInput = $(&#x27;linkedinTextInput&#x27;);
  const whatsappEnabled = $(&#x27;whatsappEnabled&#x27;);
  const bookingInput = $(&#x27;bookingInput&#x27;);
  const photoUrlInput = $(&#x27;photoUrlInput&#x27;);
  const status = $(&#x27;status&#x27;);

  function digitsPlus(v) {
    const trimmed = (v || &#x27;&#x27;).trim();
    const digits = trimmed.replace(/\D/g, &#x27;&#x27;);
    return digits ? &#x27;+&#x27; + digits : &#x27;&#x27;;
  }

  function waDigits(v) {
    return (v || &#x27;&#x27;).replace(/\D/g, &#x27;&#x27;);
  }

  function setStatus(msg, ok=true) {
    status.textContent = msg;
    status.className = &#x27;status &#x27; + (ok ? &#x27;ok&#x27; : &#x27;err&#x27;);
  }

  function update() {
    $(&#x27;employeeName&#x27;).textContent = nameInput.value || &#x27;YOUR NAME&#x27;;
    $(&#x27;employeeTitle&#x27;).textContent = titleInput.value || &#x27;Job Title&#x27;;

    const email = emailInput.value.trim() || &#x27;your.email@hotelcompas.com&#x27;;
    $(&#x27;employeeEmail&#x27;).textContent = email;
    $(&#x27;employeeEmailLink&#x27;).href = &#x27;mailto:&#x27; + email;

    const phone = phoneInput.value.trim() || &#x27;+00 000 000 000&#x27;;
    $(&#x27;employeePhone&#x27;).textContent = phone;
    $(&#x27;employeePhoneLink&#x27;).href = &#x27;tel:&#x27; + digitsPlus(phone);

    const liUrl = linkedinInput.value.trim();
    if (liUrl) {
      $(&#x27;linkedinRow&#x27;).style.display = &#x27;&#x27;;
      $(&#x27;employeeLinkedInLink&#x27;).href = liUrl;
      $(&#x27;employeeLinkedInText&#x27;).textContent = linkedinTextInput.value.trim() || &#x27;LinkedIn&#x27;;
    } else {
      $(&#x27;linkedinRow&#x27;).style.display = &#x27;none&#x27;;
    }

    if (whatsappEnabled.checked) {
      $(&#x27;whatsappRow&#x27;).style.display = &#x27;&#x27;;
      $(&#x27;employeeWhatsAppText&#x27;).textContent = phone;
      $(&#x27;employeeWhatsAppLink&#x27;).href = &#x27;https://wa.me/&#x27; + waDigits(phone);
    } else {
      $(&#x27;whatsappRow&#x27;).style.display = &#x27;none&#x27;;
    }

    const booking = bookingInput.value.trim();
    if (booking) {
      $(&#x27;calendarCell&#x27;).style.display = &#x27;&#x27;;
      $(&#x27;employeeBookingLink&#x27;).href = booking;
    } else {
      $(&#x27;calendarCell&#x27;).style.display = &#x27;none&#x27;;
      $(&#x27;employeeBookingLink&#x27;).href = &#x27;#&#x27;;
    }

    const photoUrl = photoUrlInput.value.trim();
    if (photoUrl) {
      $(&#x27;photoCell&#x27;).style.display = &#x27;&#x27;;
      $(&#x27;employeePhoto&#x27;).src = photoUrl;
      $(&#x27;employeePhoto&#x27;).style.width = &#x27;105px&#x27;;
      $(&#x27;employeePhoto&#x27;).style.height = &#x27;105px&#x27;;
      $(&#x27;employeePhoto&#x27;).style.objectFit = &#x27;cover&#x27;;
      $(&#x27;employeePhoto&#x27;).style.borderRadius = &#x27;50%&#x27;;
      $(&#x27;detailsCell&#x27;).style.padding = &#x27;6px 20px 6px 0&#x27;;
    } else {
      $(&#x27;photoCell&#x27;).style.display = &#x27;none&#x27;;
      $(&#x27;detailsCell&#x27;).style.padding = &#x27;10px 20px 10px 18px&#x27;;
    }
  }

  [nameInput,titleInput,emailInput,phoneInput,linkedinInput,linkedinTextInput,bookingInput,photoUrlInput]
    .forEach(el =&gt; el.addEventListener(&#x27;input&#x27;, update));
  whatsappEnabled.addEventListener(&#x27;change&#x27;, update);


  async function copySignature() {
    update();
    if (!nameInput.value.trim() || !titleInput.value.trim() || !emailInput.value.trim()) {
      setStatus(&#x27;Please fill in name, job title and email.&#x27;, false);
      return;
    }

    const root = $(&#x27;signatureRoot&#x27;);
    let htmlContent = root.innerHTML;
    const plainText = root.innerText;

    // Remove comments and collapse whitespace before copying to keep Gmail payload small.
    htmlContent = htmlContent
      .replace(/&lt;!--[\s\S]*?--&gt;/g, &#x27;&#x27;)
      .replace(/&gt;\s+&lt;/g, &#x27;&gt;&lt;&#x27;)
      .replace(/\s{2,}/g, &#x27; &#x27;)
      .trim();

    try {
      if (navigator.clipboard &amp;&amp; window.ClipboardItem) {
        const item = new ClipboardItem({
          &#x27;text/html&#x27;: new Blob([htmlContent], {type:&#x27;text/html&#x27;}),
          &#x27;text/plain&#x27;: new Blob([plainText], {type:&#x27;text/plain&#x27;})
        });
        await navigator.clipboard.write([item]);
        setStatus(&#x27;✓ Signature copied. Paste it into Gmail settings.&#x27;);
        return;
      }
    } catch (e) {
      // fallback below
    }

    const range = document.createRange();
    range.selectNodeContents(root);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    const ok = document.execCommand(&#x27;copy&#x27;);
    sel.removeAllRanges();
    setStatus(ok ? &#x27;✓ Signature copied. Paste it into Gmail settings.&#x27; : &#x27;Could not copy automatically. Select the preview and copy it manually.&#x27;, ok);
  }

  $(&#x27;copyBtn&#x27;).addEventListener(&#x27;click&#x27;, copySignature);

  $(&#x27;resetBtn&#x27;).addEventListener(&#x27;click&#x27;, function() {
    nameInput.value = &#x27;YOUR NAME&#x27;;
    titleInput.value = &#x27;Job Title&#x27;;
    emailInput.value = &#x27;your.email@hotelcompas.com&#x27;;
    phoneInput.value = &#x27;+00 000 000 000&#x27;;
    linkedinInput.value = &#x27;&#x27;;
    linkedinTextInput.value = &#x27;LinkedIn&#x27;;
    bookingInput.value = &#x27;&#x27;;
    whatsappEnabled.checked = true;
    photoUrlInput.value = &#x27;&#x27;;
    $(&#x27;employeePhoto&#x27;).src = &#x27;data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22105%22 height=%22105%22 viewBox=%220 0 105 105%22%3E%3Ccircle cx=%2252.5%22 cy=%2252.5%22 r=%2252.5%22 fill=%22%23DADADA%22/%3E%3C/svg%3E&#x27;;
    update();
    setStatus(&#x27;Fields reset.&#x27;);
  });

  update();
})();
&lt;/script&gt;

&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;JetCompas Email Signature Generator&lt;/title&gt;
&lt;style&gt;
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#111}
.app{max-width:1280px;margin:0 auto;padding:26px}
.header{margin-bottom:18px}
.header h1{margin:0;color:#111;font-size:24px}
.header p{margin:6px 0 0;color:#6b7280;font-size:14px}
.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;align-items:start}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.form{padding:20px;position:sticky;top:18px}
.preview{padding:20px;overflow:auto}
label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px;color:#333}
label .opt{font-weight:400;color:#777}
input[type=text],input[type=email],input[type=tel],input[type=url]{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
input:focus{outline:none;border-color:#ed000c;box-shadow:0 0 0 3px rgba(237,0,12,.08)}
.check{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px;font-weight:500}
.btn{width:100%;margin-top:18px;border:0;border-radius:9px;padding:12px 14px;background:#ed000c;color:#111;font-weight:800;cursor:pointer}
.small{font-size:12px;color:#6b7280;line-height:1.45}
.status{margin-top:10px;min-height:18px;font-size:12px;font-weight:700}
.ok{color:#137333} .err{color:#b42318}
.stage{width:max-content;min-width:760px;background:#fff;padding:2px}
.preview-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.preview-head h2{font-size:17px;margin:0}
@media(max-width:980px){.grid{grid-template-columns:1fr}.form{position:static}}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;div class=&quot;header&quot;&gt;
    &lt;h1&gt;JetCompas Email Signature Generator&lt;/h1&gt;
    &lt;p&gt;Photo, personal LinkedIn, WhatsApp and Calendar booking are optional. The signature adapts automatically.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;

      &lt;input id=&quot;photoUrl&quot; type=&quot;url&quot; placeholder=&quot;https://.../photos/name.jpg&quot;&gt;

      &lt;label for=&quot;fullName&quot;&gt;Full name&lt;/label&gt;
      &lt;input id=&quot;fullName&quot; type=&quot;text&quot; value=&quot;YOUR NAME&quot;&gt;

      &lt;label for=&quot;jobTitle&quot;&gt;Job title&lt;/label&gt;
      &lt;input id=&quot;jobTitle&quot; type=&quot;text&quot; value=&quot;Job Title&quot;&gt;

      &lt;label for=&quot;email&quot;&gt;Corporate email&lt;/label&gt;
      &lt;input id=&quot;email&quot; type=&quot;email&quot; value=&quot;your.email@jetcompas.com&quot;&gt;

      &lt;label for=&quot;phone&quot;&gt;Phone&lt;/label&gt;
      &lt;input id=&quot;phone&quot; type=&quot;tel&quot; value=&quot;+00 000 000 000&quot;&gt;

      &lt;label for=&quot;linkedinUrl&quot;&gt;Personal LinkedIn URL &lt;span class=&quot;opt&quot;&gt;(optional)&lt;/span&gt;&lt;/label&gt;
      &lt;input id=&quot;linkedinUrl&quot; type=&quot;url&quot; placeholder=&quot;https://www.linkedin.com/in/...&quot;&gt;

      &lt;label for=&quot;linkedinText&quot;&gt;LinkedIn text shown&lt;/label&gt;
      &lt;input id=&quot;linkedinText&quot; type=&quot;text&quot; value=&quot;LinkedIn&quot;&gt;

      &lt;label&gt;WhatsApp &lt;span class=&quot;opt&quot;&gt;(optional)&lt;/span&gt;&lt;/label&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;input id=&quot;waEnabled&quot; type=&quot;checkbox&quot; checked&gt; Use the phone number above for WhatsApp&lt;/div&gt;

      &lt;label for=&quot;bookingUrl&quot;&gt;Google Calendar booking link &lt;span class=&quot;opt&quot;&gt;(optional)&lt;/span&gt;&lt;/label&gt;
      &lt;input id=&quot;bookingUrl&quot; type=&quot;url&quot; placeholder=&quot;https://calendar.google.com/calendar/appointments/...&quot;&gt;

      &lt;button class=&quot;btn&quot; id=&quot;copyBtn&quot;&gt;COPY SIGNATURE&lt;/button&gt;
      &lt;div id=&quot;status&quot; class=&quot;status&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;After copying: Gmail → Settings → See all settings → General → Signature → Create new → paste.&lt;/p&gt;
    &lt;/section&gt;

        waEnabled = $(&#x27;waEnabled&#x27;), bookingUrl = $(&#x27;bookingUrl&#x27;), photoUrl = $(&#x27;photoUrl&#x27;),
        status = $(&#x27;status&#x27;);

  function digits(v){ return (v||&#x27;&#x27;).replace(/\D/g,&#x27;&#x27;); }
  function tel(v){ const d=digits(v); return d ? &#x27;+&#x27;+d : &#x27;&#x27;; }
  function setStatus(msg,ok=true){ status.textContent=msg; status.className=&#x27;status &#x27;+(ok?&#x27;ok&#x27;:&#x27;err&#x27;); }

  function update(){
    $(&#x27;employeeName&#x27;).textContent = fullName.value.trim() || &#x27;YOUR NAME&#x27;;
    $(&#x27;employeeTitle&#x27;).textContent = jobTitle.value.trim() || &#x27;Job Title&#x27;;

    const em = email.value.trim() || &#x27;your.email@jetcompas.com&#x27;;
    $(&#x27;employeeEmail&#x27;).textContent = em;
    $(&#x27;employeeEmailLink&#x27;).href = &#x27;mailto:&#x27;+em;

    const ph = phone.value.trim() || &#x27;+00 000 000 000&#x27;;
    $(&#x27;employeePhone&#x27;).textContent = ph;
    $(&#x27;employeePhoneLink&#x27;).href = &#x27;tel:&#x27;+tel(ph);

    const li = linkedinUrl.value.trim();
    $(&#x27;linkedinRow&#x27;).style.display = li ? &#x27;&#x27; : &#x27;none&#x27;;
    if(li){
      $(&#x27;employeeLinkedInLink&#x27;).href = li;
      $(&#x27;employeeLinkedInText&#x27;).textContent = linkedinText.value.trim() || &#x27;LinkedIn&#x27;;
    }

    $(&#x27;whatsappRow&#x27;).style.display = waEnabled.checked ? &#x27;&#x27; : &#x27;none&#x27;;
    if(waEnabled.checked){
      $(&#x27;employeeWhatsAppText&#x27;).textContent = ph;
      $(&#x27;employeeWhatsAppLink&#x27;).href = &#x27;https://wa.me/&#x27;+digits(ph);
    }

    const p = photoUrl.value.trim();
    $(&#x27;photoCell&#x27;).style.display = p ? &#x27;&#x27; : &#x27;none&#x27;;
    if(p) $(&#x27;employeePhoto&#x27;).src = p;

    const b = bookingUrl.value.trim();
    $(&#x27;calendarCell&#x27;).style.display = b ? &#x27;&#x27; : &#x27;none&#x27;;
    if(b) $(&#x27;employeeBookingLink&#x27;).href = b;
  }

  [fullName,jobTitle,email,phone,linkedinUrl,linkedinText,bookingUrl,photoUrl].forEach(el=&gt;el.addEventListener(&#x27;input&#x27;,update));
  waEnabled.addEventListener(&#x27;change&#x27;,update);

  function absolutize(root){
    root.querySelectorAll(&#x27;img&#x27;).forEach(img=&gt;{
      if(img.getAttribute(&#x27;src&#x27;)) img.setAttribute(&#x27;src&#x27;, new URL(img.getAttribute(&#x27;src&#x27;), window.location.href).href);
    });
    root.querySelectorAll(&#x27;a&#x27;).forEach(a=&gt;{
      const h=a.getAttribute(&#x27;href&#x27;);
      if(h &amp;&amp; !/^(mailto:|tel:|https?:|#)/i.test(h)) a.setAttribute(&#x27;href&#x27;, new URL(h, window.location.href).href);
    });
  }

  async function copySignature(){
    update();
    if(!fullName.value.trim() || !jobTitle.value.trim() || !email.value.trim() || !phone.value.trim()){
      setStatus(&#x27;Please fill in name, job title, email and phone.&#x27;,false); return;
    }
    const clone = $(&#x27;signatureRoot&#x27;).cloneNode(true);
    absolutize(clone);
    let h = clone.innerHTML.replace(/&lt;!--[\s\S]*?--&gt;/g,&#x27;&#x27;).replace(/&gt;\s+&lt;/g,&#x27;&gt;&lt;&#x27;).replace(/\s{2,}/g,&#x27; &#x27;).trim();
    const t = clone.innerText;

    try{
      if(navigator.clipboard &amp;&amp; window.ClipboardItem){
        await navigator.clipboard.write([new ClipboardItem({
          &#x27;text/html&#x27;: new Blob([h],{type:&#x27;text/html&#x27;}),
          &#x27;text/plain&#x27;: new Blob([t],{type:&#x27;text/plain&#x27;})
        })]);
        setStatus(&#x27;✓ Signature copied. Paste it into Gmail.&#x27;);
        return;
      }
    }catch(e){}

    const range=document.createRange(); range.selectNodeContents($(&#x27;signatureRoot&#x27;));
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    const ok=document.execCommand(&#x27;copy&#x27;); sel.removeAllRanges();
    setStatus(ok?&#x27;✓ Signature copied. Paste it into Gmail.&#x27;:&#x27;Copy failed. Select the preview and copy manually.&#x27;,ok);
  }

  $(&#x27;copyBtn&#x27;).addEventListener(&#x27;click&#x27;,copySignature);
  update();
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
  </div>
</div>

<script>
(function(){
  const sw = document.getElementById('brandSwitch');
  const hotelTab = document.getElementById('hotelTab');
  const jetTab = document.getElementById('jetTab');
  const hotelPage = document.getElementById('hotelPage');
  const jetPage = document.getElementById('jetPage');

  function show(which){
    const isJet = which === 'jet';
    sw.classList.toggle('jet', isJet);
    hotelTab.classList.toggle('active', !isJet);
    jetTab.classList.toggle('active', isJet);
    hotelPage.classList.toggle('active', !isJet);
    jetPage.classList.toggle('active', isJet);
    try { localStorage.setItem('signatureBrand', which); } catch(e) {}
  }

  hotelTab.addEventListener('click', () => show('hotel'));
  jetTab.addEventListener('click', () => show('jet'));

  try {
    if(localStorage.getItem('signatureBrand') === 'jet') show('jet');
  } catch(e) {}
})();
</script>
</body>
</html>
